<!doctype html>
<html lang="sk" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <style>
      html {
        background: #09090b;
        color-scheme: dark;
      }
      html[data-theme='light'] {
        background: #f7f8f5;
        color-scheme: light;
      }
    </style>
    <script>
      // Použijeme uloženú tému ešte pred prvým vykreslením stránky.
      try {
        const theme = localStorage.getItem('ynet-theme') === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#09090b' : '#f7f8f5'
      } catch {}
    </script>
    <meta
      name="description"
      content="Plánujte aktivity na internátoch. Vyberte miestnosti, rozdeľte úlohy a majte prehľad o hotovej práci."
    />
    <title>Ynet · Aktivity</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
